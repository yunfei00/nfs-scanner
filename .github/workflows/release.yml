name: Release Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DIST_DIR: dist/NFSScanner
      VERSION_NAME: ${{ github.ref_name || 'manual' }}
      QT_QPA_PLATFORM: offscreen
      NFS_SCANNER_DISABLE_AUTO_STARTUP_TASKS: "1"
      NFS_SCANNER_CONFIG_DIR: ${{ runner.temp }}\nfs-scanner\config
      NFS_SCANNER_STATE_DIR: ${{ runner.temp }}\nfs-scanner\state
      NFS_SCANNER_DATA_DIR: ${{ runner.temp }}\nfs-scanner\data
      SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-windows.lock
            requirements-dev.lock
            requirements-build.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r requirements-windows.lock -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify release source
        shell: pwsh
        run: |
          python -m pytest -q
          python -m ruff check nfs_scanner tests tools scripts run.py
          python -m compileall -q nfs_scanner tools scripts
          python tools\unified_ui_check.py

      - name: Build with PyInstaller spec
        shell: pwsh
        run: pyinstaller --clean --noconfirm NFSScanner.spec

      - name: Generate SPDX SBOM
        shell: pwsh
        run: >-
          python tools\generate_sbom.py
          --requirements requirements-windows.lock
          --output "$env:DIST_DIR\sbom.spdx.json"

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $env:NFS_SCANNER_AUTOCLOSE_MS = "800"
          $process = Start-Process "$env:DIST_DIR\NFSScanner.exe" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Packaged application exited with code $($process.ExitCode)"
          }

      - name: Require signing certificate for tag release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_CERTIFICATE == ''
        shell: pwsh
        run: throw "Tag releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets."

      - name: Sign application executable
        if: env.SIGNING_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "nfs-scanner-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:SIGNING_PASSWORD "$env:DIST_DIR\NFSScanner.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable signing failed" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 is not installed on the runner" }
          & $compiler "packaging\windows\NFSScanner.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Sign Windows installer
        if: env.SIGNING_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "nfs-scanner-signing.pfx"
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $installer = Get-ChildItem "dist\NFSScanner-*-windows-x64-setup.exe" | Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:SIGNING_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }

      - name: Package portable ZIP and checksums
        id: package
        shell: pwsh
        run: |
          $zipName = "NFSScanner-$env:VERSION_NAME-windows-x64.zip"
          $zipPath = "dist\$zipName"
          Compress-Archive -Path "$env:DIST_DIR\*" -DestinationPath $zipPath -Force
          $installer = Get-ChildItem "dist\NFSScanner-*-windows-x64-setup.exe" | Select-Object -First 1
          $assets = @((Get-Item $zipPath), $installer)
          $checksumPath = "dist\SHA256SUMS.txt"
          $assets | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File $checksumPath -Encoding ascii -Append
          }
          "zip_path=$zipPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_path=$($installer.FullName)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NFSScanner-${{ env.VERSION_NAME }}-windows-x64
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.installer_path }}
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.installer_path }}
            dist/SHA256SUMS.txt
