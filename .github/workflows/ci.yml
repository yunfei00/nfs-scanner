name: Continuous Integration

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      NFS_SCANNER_DISABLE_AUTO_STARTUP_TASKS: "1"
      NFS_SCANNER_CONFIG_DIR: ${{ runner.temp }}\nfs-scanner\config
      NFS_SCANNER_STATE_DIR: ${{ runner.temp }}\nfs-scanner\state
      NFS_SCANNER_DATA_DIR: ${{ runner.temp }}\nfs-scanner\data

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-windows.lock
            requirements-dev.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r requirements-windows.lock -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify source
        shell: pwsh
        run: |
          python -m pytest -q
          python -m ruff check nfs_scanner tests tools scripts run.py
          python -m compileall -q nfs_scanner tools scripts
          python tools\unified_ui_check.py

      - name: Smoke-start unified application
        shell: pwsh
        run: |
          $env:NFS_SCANNER_AUTOCLOSE_MS = "500"
          python -m nfs_scanner
