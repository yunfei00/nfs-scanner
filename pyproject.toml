[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfs-scanner"
dynamic = ["version"]
description = "Near Field Scan System"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=2.0,<3.0",
    "pyvisa>=1.14,<2.0",
    "opencv-python>=4.10,<5.0",
]

[project.scripts]
nfs-scanner = "nfs_scanner.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "output", "outputs"]

[tool.ruff.lint.per-file-ignores]
# Standalone repository scripts adjust sys.path before importing the package.
"scripts/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["nfs_scanner*"]

[tool.setuptools.data-files]
"resources/styles" = ["resources/styles/engineering_dark.qss"]
"resources/icons" = ["resources/icons/nfs_scanner.svg"]
"config" = ["config/devices.example.yaml", "config/scan_defaults.yaml"]

[tool.setuptools.dynamic]
version = {attr = "nfs_scanner.version.APP_VERSION"}
