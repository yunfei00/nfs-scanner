mode: mock

motion:
  type: serial_gcode
  enabled: false
  port: COM3
  baudrate: 115200
  timeout_s: 3
  command_delay_ms: 50
  settle_delay_ms: 200
  soft_limits:
    x_min: 0
    x_max: 180
    y_min: 0
    y_max: 140
    z_min: 0
    z_max: 50
  commands:
    home: "$H"
    stop: "!"
    unlock: "$X"
    status: "?"
    move_absolute: "G90 G0 X{x:.3f} Y{y:.3f} Z{z:.3f}"

instrument:
  type: fsw
  enabled: false
  transport: visa
  resource: "TCPIP0::192.168.1.100::inst0::INSTR"
  timeout_s: 10
  trace_name: "TRACE1"
  frequency:
    start_hz: 2400000000
    stop_hz: 2500000000
    points: 1001
  bandwidth:
    rbw_hz: 10000
    vbw_hz: 10000
  sweep:
    continuous: false
    sweep_time_s: null

camera:
  enabled: true
  default_name: "LRCP  F1080P"
  width: 1920
  height: 1080
  fps: 30
  fourcc: MJPG
  safe_enumeration: true
