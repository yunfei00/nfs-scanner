# Safe example — copy to the current user's NFSScanner config directory.
#   New-Item -ItemType Directory -Force "$env:APPDATA\NFSScanner"
#   Copy-Item config\devices.example.yaml "$env:APPDATA\NFSScanner\devices.local.yaml"
#
# Real hardware requires ALL of:
#   - mode: real
#   - motion.enabled / instrument.enabled as needed
#   - NFS_SCANNER_REAL_DEVICES=1
#   - NFS_SCANNER_DEVICE_MODE=real
#   - explicit operator confirmation before opening a real control channel

mode: mock

motion:
  type: serial_gcode
  enabled: false
  port: ""
  baudrate: 115200
  timeout_s: 3
  command_delay_ms: 50
  settle_delay_ms: 200
  soft_limits:
    x_min: 0
    x_max: 200
    y_min: -300
    y_max: 0
    z_min: 0
    z_max: 10
  commands:
    home: "$H"
    stop: "!"
    unlock: "$X"
    status: "?"
    move_absolute: "G90 G0 X{x:.3f} Y{y:.3f} Z{z:.3f}"

instrument:
  type: FSW
  enabled: false
  transport: visa
  resource: ""
  timeout_s: 10
  trace_name: TRACE1
  frequency:
    start_hz: 2400000000
    stop_hz: 2500000000
    points: 1001
  bandwidth:
    rbw_hz: 10000
    vbw_hz: 10000
  sweep:
    continuous: false
    sweep_time_s: null

camera:
  enabled: false
  default_name: ""
  width: 1920
  height: 1080
  fps: 30
  fourcc: MJPG
  safe_enumeration: true
